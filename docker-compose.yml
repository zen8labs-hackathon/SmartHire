version: "3.8"

services:
  # app:
  #   build: .
  #   image: smart_hire:latest
  #   container_name: smarthire_app
  #   ports:
  #     - "3100:3100"
  #   env_file:
  #     - .env
  #   depends_on:
  #     floci:
  #       condition: service_started
  #   restart: unless-stopped

  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: smart_hire
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d smart_hire"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_local
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # --- WORKER: xử lý job upload CV (BullMQ) từ hàng đợi Redis ---
  worker:
    image: node:20-alpine
    container_name: file_upload_worker
    working_dir: /app
    volumes:
      - ./:/app
      # node_modules riêng cho container, không dùng chung với node_modules
      # trên host (host cài bằng pnpm -- symlink store trong .pnpm/; container
      # lại chạy `npm install` bên dưới với quyền root). Nếu để chung, npm
      # cố rename đè lên cấu trúc symlink của pnpm, mỗi lần container
      # restart lại chạy npm install lại trên cùng thư mục vật lý và để lại
      # rác (thư mục do root tạo dở dang) -> ENOTEMPTY, crash-loop vô hạn.
      - worker_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      AWS_ENDPOINT_URL: http://floci:4566
      DATABASE_URL: postgresql://admin:admin@db:5432/smart_hire

      INTERNAL_APP_URL: http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      floci:
        condition: service_started
    command: sh -c "npm install && npm run worker:build && npm run worker"
    restart: unless-stopped

  # --- HỆ THỐNG GIẢ LẬP AWS S3 (FLOCI) ---
  floci:
    image: floci/floci:latest
    container_name: floci_local
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - DEBUG=1
      # 1. Kích hoạt chế độ lưu xuống đĩa
      - FLOCI_STORAGE_MODE=persistent
      # 2. Khai báo thư mục chứa data bên trong container của Floci
      - FLOCI_STORAGE_PERSISTENT_PATH=/floci-data
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "${TMPDIR:-/tmp}/floci:/tmp/floci"
      - "./.floci-init:/etc/floci/init/ready.d"
      # 3. Ánh xạ thư mục /floci-data từ container ra máy thật
      - "./floci-data:/floci-data"
    restart: unless-stopped

volumes:
  pgdata:
    external: true
  redisdata:
  worker_node_modules:
