# Production stack for EC2 (smart-hire.zen8labs.io).
# Usage (on the server, from the repo root):
#   cp .env.production.example .env   # then fill secrets
#   docker compose -f docker-compose.prod.yml up -d db minio
#   docker compose -f docker-compose.prod.yml up minio-init
#   docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d --build app
#
# Logging stack (optional, for Grafana dashboard):
#   docker compose -f docker-compose.prod.yml up -d loki promtail grafana
#   Access Grafana at http://127.0.0.1:3001 (via SSM port-forward)

services:
  db:
    image: postgres:16-alpine
    container_name: smarthire_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smarthire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smart_hire}
    volumes:
      - smarthire_pgdata:/var/lib/postgresql/data
    # Only reachable from this host / compose network — not the public internet.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-smarthire} -d ${POSTGRES_DB:-smart_hire}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage when you have no AWS S3 bucket.
  # Browser uploads go: HTTPS → nginx /minio/ → 127.0.0.1:9000
  minio:
    image: minio/minio:latest
    container_name: smarthire_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env (min 8 chars)}
      # Free MinIO: bucket-level `mc cors` often fails — global API CORS is reliable.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-https://smart-hire.zen8labs.io}
    volumes:
      - smarthire_minio:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Create bucket + CORS once MinIO is healthy (idempotent).
  minio-init:
    image: minio/mc:latest
    container_name: smarthire_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:-smart-hire-bucket}
    volumes:
      - ./deploy/minio/cors.json:/cors.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb -p "local/$$S3_BUCKET" || true
        # JSON file needs set-json (set expects XML). Bucket CORS may be unsupported on
        # free MinIO — non-fatal because MINIO_API_CORS_ALLOW_ORIGIN is set on the server.
        mc cors set-json "local/$$S3_BUCKET" /cors.json || echo "WARN: bucket CORS skipped (using global MINIO_API_CORS_ALLOW_ORIGIN)"
        echo "MinIO bucket $$S3_BUCKET ready"
    restart: "no"

  # Redis — BullMQ queue backend for the CV-upload worker. Internal only
  # (no published port); reachable on the compose network as `redis:6379`.
  redis:
    image: redis:7-alpine
    container_name: smarthire_redis
    restart: unless-stopped
    volumes:
      - smarthire_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      # Force compose DNS name even if .env still says localhost from a laptop copy.
      DATABASE_URL: postgresql://${POSTGRES_USER:-smarthire}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smart_hire}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install && npm run db:migrate"
    profiles:
      - migrate

  app:
    build: .
    image: smart_hire:prod
    container_name: smarthire_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      NODE_ENV: production
      PORT: "3100"
      # App talks to Postgres on the compose network.
      DATABASE_URL: postgresql://${POSTGRES_USER:-smarthire}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smart_hire}
      # BullMQ queue — the app enqueues CV-upload jobs the worker drains.
      REDIS_URL: redis://redis:6379
      # MinIO credentials (same as root user). Override real-AWS IAM if both set.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      # Public URL for browser presigned PUTs — same host, path-style /{bucket}/...
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-https://smart-hire.zen8labs.io}
    ports:
      - "127.0.0.1:3100:3100"
    # So the app container can call the public MinIO URL via host nginx.
    extra_hosts:
      - "smart-hire.zen8labs.io:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # ─── BullMQ worker: compiled JS from image (Dockerfile `worker` target) ──────
  # One slot-independent instance — it drains the Redis queue regardless of
  # which blue/green app slot is live. Pushes realtime notifications back to the
  # app through the public URL (nginx routes to the active slot); the internal
  # endpoint is guarded by INTERNAL_API_SECRET.
  worker:
    build:
      context: .
      target: worker
    image: smart_hire_worker:prod
    container_name: smarthire_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-smarthire}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smart_hire}
      REDIS_URL: redis://redis:6379
      # Worker only GETs objects server-side — hit MinIO directly on the compose
      # network, no nginx/TLS. forcePathStyle auto-enables when AWS_ENDPOINT_URL
      # is set (lib/storage/s3.ts).
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_ENDPOINT_URL: http://minio:9000
      # Realtime-notification push target. Blue-green has no fixed app container,
      # so go through the public host (nginx → active slot). INTERNAL_API_SECRET
      # from .env must match the app.
      INTERNAL_APP_URL: ${INTERNAL_APP_URL:-https://smart-hire.zen8labs.io}
    extra_hosts:
      - "smart-hire.zen8labs.io:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # ─── Logging stack ────────────────────────────────────────────────────────────
  # Access: SSM port-forward 3001 → http://127.0.0.1:3001 (admin / GrafanaPassword)

  loki:
    image: grafana/loki:3.2.0
    container_name: smarthire_loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3102:3100"   # HTTP API (3100 inside, 3102 outside to avoid app conflict)
    volumes:
      - ./deploy/logging/loki-config.yml:/etc/loki/local-config.yaml:ro
      - smarthire_loki_data:/loki
    user: "0"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:3.2.0
    container_name: smarthire_promtail
    restart: unless-stopped
    volumes:
      - ./deploy/logging/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # read container stdout
      - smarthire_promtail_positions:/var/lib/promtail
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    # Only scrape containers named smarthire_* (prod + dev stacks)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: smarthire_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Serve under /log/ subpath (matches nginx grafana-proxy.conf)
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/log
      - GF_SERVER_SERVE_FROM_ROOT_PATH=false
    volumes:
      - smarthire_grafana_data:/var/lib/grafana
      - ./deploy/logging/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki

volumes:
  smarthire_pgdata:
  smarthire_minio:
  smarthire_redis_data:
  smarthire_loki_data:
  smarthire_promtail_positions:
  smarthire_grafana_data:
