apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      httpMethod: GET
      timeInterval: 10s
    # Grafana reads GRAFANA_ADMIN_PASSWORD from env — no hardcoded secrets here.
    # The password itself is set via GF_SECURITY_ADMIN_PASSWORD in docker-compose.
    editable: true