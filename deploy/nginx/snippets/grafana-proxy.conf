# Proxy /log and /log/* → Grafana at localhost:3001
# IMPORTANT: use exact /log and prefix /log/ — NOT bare /log
# (bare `location /log` also matches /login, /logout, etc.)
#
# Usage: include inside the HTTPS server {} block of your site config.
# Grafana must have GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/log

location = /log {
    return 302 /log/;
}

location /log/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_pass http://127.0.0.1:3001/;
}
