# Proxy /log/* → Grafana at localhost:3001
# Usage: add `include /opt/smarthire/app/deploy/nginx/snippets/grafana-proxy.conf;`
#        inside the server {} block of your site config.
# Grafana must have GF_SERVER_ROOT_URL set to %(protocol)s://%(domain)s/log

location /log {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Uri /log;
    proxy_set_header Connection "";
    proxy_pass http://localhost:3001;
}

location /log/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Uri /log/;
    proxy_set_header Connection "";
    proxy_pass http://localhost:3001/;
}